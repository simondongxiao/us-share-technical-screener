<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>美股技术筛选</title>
<style>
:root{--bg:#f6f5f1;--panel:#fffdfa;--ink:#18211f;--muted:#67716e;--line:#dedbd2;--red:#c84435;--green:#11805a;--blue:#2e6f9e;--gold:#a8701b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,"Microsoft YaHei",sans-serif}.app{height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:#ebe7dc}.brand{font-weight:700;font-size:18px;white-space:nowrap}.controls{display:flex;align-items:center;gap:8px;min-width:0;flex:1}.control,.btn{height:34px;border:1px solid #c9c5b9;background:var(--panel);border-radius:6px;padding:0 10px}.search{min-width:220px;flex:1}.btn{width:36px;font-size:17px;cursor:pointer}.sortBar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:#faf8f0}.sortBtn{height:28px;border:1px solid #c9c5b9;background:#fff;border-radius:6px;padding:0 8px;cursor:pointer;font-size:12px}.sortBtn.active{background:#e8f0f5;border-color:#9ac2dc;font-weight:700}.hint{color:var(--muted);font-size:12px;white-space:nowrap}.main{min-height:0;flex:1;display:grid;grid-template-columns:290px minmax(420px,1fr) 390px}.sidebar,.detail{overflow:auto;border-right:1px solid var(--line);background:var(--panel)}.detail{border-right:0;border-left:1px solid var(--line);padding:10px}.stats{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:5px}.statsLine{display:flex;justify-content:space-between;color:var(--muted)}.statsLine b{color:var(--ink)}.list{padding:6px}.row{display:grid;grid-template-columns:68px 1fr 70px;gap:8px;align-items:center;min-height:54px;padding:7px;border-radius:6px;cursor:pointer;border:1px solid transparent}.row:hover{background:#f0eee7}.row.active{background:#e8f0f5;border-color:#b8d3e3}.code{font:700 13px Consolas,monospace}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.industry{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.metric{text-align:right;font:700 13px Consolas,monospace}.chartPane{min-width:0;display:flex;flex-direction:column;background:#fbfaf6}.chartHead{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.stockTitle{font-size:22px;font-weight:800}.subTitle{color:var(--muted)}.toolBtn{width:34px;height:32px;border:1px solid #c9c5b9;background:#fff;border-radius:6px;cursor:pointer}.canvasWrap{position:relative;flex:1;min-height:300px}.canvasWrap canvas{width:100%;height:100%;display:block}.legend{position:absolute;top:10px;right:12px;display:flex;gap:10px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:18px;height:3px;margin-right:4px;vertical-align:middle}.status{height:32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:7px 14px;color:var(--muted);font:12px Consolas,monospace}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}.card h3{margin:0 0 8px;font-size:14px}.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 8px}.kv span{color:var(--muted)}.kv b{font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);background:#faf8f0}.chip.flag{background:#eaf4ef;border-color:#acd7bf;color:#11633f}.chip.off{opacity:.45}.empty{color:var(--muted);font-size:13px}.source{font-size:12px;color:var(--muted);margin-top:8px}a{color:#1b6897;text-decoration:none}
@media(max-width:900px){.app{height:auto;min-height:100vh}.top{align-items:flex-start;flex-direction:column}.controls{width:100%;flex-wrap:wrap}.main{display:block}.sidebar,.detail{max-height:none;border:0}.chartPane{height:520px}.hint{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">美股技术筛选</div><div class="controls"><select id="dateSelect" class="control"></select><select id="poolSelect" class="control"></select><input id="searchInput" class="control search" placeholder="搜索代码 / 公司 / 交易所" /><button id="prevBtn" class="btn" title="上一只">↑</button><button id="nextBtn" class="btn" title="下一只">↓</button><button id="zoomInBtn" class="btn" title="放大K线">＋</button><button id="zoomOutBtn" class="btn" title="缩小K线">－</button><div class="hint">↑↓ 切股 · ←→ 移动日K · 点击K线选日 · PageUp/PageDown 快翻 · +/- 缩放</div></div></div>
  <div class="main"><aside class="sidebar"><div class="stats"><div class="statsLine"><span>基准交易日</span><b id="baseDate"></b></div><div class="statsLine"><span>数据状态</span><b id="dataStatus"></b></div><div class="statsLine"><span>股票池数量</span><b id="poolCount"></b></div><div class="statsLine"><span>当前序号</span><b id="positionText"></b></div></div><div class="sortBar"><button id="sortAlphaBtn" class="sortBtn" title="按股票代码字母排序">字母↕</button><button id="sortCapBtn" class="sortBtn" title="按市值排序">市值↕</button></div><div id="stockList" class="list"></div></aside>
  <section class="chartPane"><div class="chartHead"><div><div id="stockTitle" class="stockTitle">-</div><div id="stockSubtitle" class="subTitle">-</div></div><div><button id="chartZoomIn" class="toolBtn" title="放大">＋</button><button id="chartZoomOut" class="toolBtn" title="缩小">－</button></div></div><div class="canvasWrap"><canvas id="kCanvas"></canvas><div class="legend"><span><i style="background:#2e6f9e"></i>MA5</span><span><i style="background:#a8701b"></i>MA10</span></div></div><div class="status"><span id="chartStatus"></span><span id="priceStatus"></span></div></section>
  <aside id="detailPanel" class="detail"></aside></div>
</div>
<script>
let APP=null;let poolKeys=[];let chartMeta=null;const state={date:null,pool:'consecutive_3d_gain',symbols:[],filtered:[],selected:0,windowSize:70,sortKey:'pool',sortDir:'desc',chartIndex:null};const $=id=>document.getElementById(id);const fmt=(v,d=2)=>{if(v===null||v===undefined||Number.isNaN(Number(v)))return'-';const out=Number(v).toFixed(d);return d===0?out:out.replace(/\.?0+$/,'')};const metricFieldByPool={consecutive_5d_gain:'gain5',gain5_top100:'gain5',break_pullback_ma5:'dev5',break_ma5_pullback_ma10:'dev10',new_year_high:'year_high_breakout',near_year_high_10pct:'year_high_distance',new_3y_high:'three_year_high_breakout',near_3y_high_10pct:'three_year_high_distance',new_all_time_high:'all_time_high_breakout'};const pctPools=new Set(Object.keys(metricFieldByPool).concat(['gain3_top100']));
async function init(){$('dataStatus').textContent='数据加载中...';const response=await fetch('app-data-2026-09-02.json',{cache:'no-store'});if(!response.ok)throw new Error('app-data '+response.status);APP=await response.json();poolKeys=Object.keys(APP.poolConfig);const dates=Object.keys(APP.dates).sort().reverse();$('dateSelect').innerHTML=dates.map(d=>`<option value="${d}">${d}</option>`).join('');$('poolSelect').innerHTML=poolKeys.map(k=>`<option value="${k}">${APP.poolConfig[k].label}</option>`).join('');state.date=dates[0];$('dateSelect').value=state.date;$('poolSelect').value=state.pool;bindEvents();loadPool()}
function bindEvents(){$('dateSelect').addEventListener('change',e=>{state.date=e.target.value;loadPool()});$('poolSelect').addEventListener('change',e=>{state.pool=e.target.value;loadPool()});$('searchInput').addEventListener('input',applyFilter);$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));$('zoomInBtn').addEventListener('click',()=>zoom(-12));$('zoomOutBtn').addEventListener('click',()=>zoom(12));$('chartZoomIn').addEventListener('click',()=>zoom(-12));$('chartZoomOut').addEventListener('click',()=>zoom(12));$('sortAlphaBtn').addEventListener('click',()=>toggleSort('alpha'));$('sortCapBtn').addEventListener('click',()=>toggleSort('marketCap'));$('kCanvas').addEventListener('click',selectCandleFromMouse);$('kCanvas').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?-8:8)},{passive:false});window.addEventListener('resize',drawChart);window.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();moveCandle(1)}if(e.key==='ArrowLeft'){e.preventDefault();moveCandle(-1)}if(e.key==='ArrowDown'){e.preventDefault();move(1)}if(e.key==='ArrowUp'){e.preventDefault();move(-1)}if(e.key==='PageDown'){e.preventDefault();move(10)}if(e.key==='PageUp'){e.preventDefault();move(-10)}if(e.key==='+'||e.key==='='){e.preventDefault();zoom(-10)}if(e.key==='-'||e.key==='_'){e.preventDefault();zoom(10)}})}
function currentDateData(){return APP.dates[state.date]}function currentStock(){const symbol=state.filtered[state.selected];return symbol?currentDateData().stocks[symbol]:null}
function loadPool(){const data=currentDateData();state.symbols=(data.pools[state.pool]||[]).slice();state.selected=0;$('baseDate').textContent=data.summary.base_date||state.date;$('dataStatus').textContent=data.summary.data_status||'-';applyFilter()}
function applyFilter(){const q=$('searchInput').value.trim().toLowerCase();const stocks=currentDateData().stocks;state.filtered=state.symbols.filter(t=>{if(!q)return true;const s=stocks[t];return [s.ticker,s.symbol,s.name,s.exchange].join(' ').toLowerCase().includes(q)});applySort();state.selected=Math.min(state.selected,Math.max(0,state.filtered.length-1));renderList();renderSelected()}function toggleSort(key){if(state.sortKey===key){state.sortDir=state.sortDir==='asc'?'desc':'asc'}else{state.sortKey=key;state.sortDir=key==='marketCap'?'desc':'asc'}applySort();state.selected=0;renderList();renderSelected()}function applySort(){const stocks=currentDateData().stocks;if(state.sortKey==='alpha'){state.filtered.sort((a,b)=>state.sortDir==='asc'?a.localeCompare(b):b.localeCompare(a))}else if(state.sortKey==='marketCap'){state.filtered.sort((a,b)=>{const av=stocks[a].marketCap??-1,bv=stocks[b].marketCap??-1;return state.sortDir==='asc'?av-bv:bv-av})}}function renderSortButtons(){const a=$('sortAlphaBtn'),c=$('sortCapBtn');if(!a||!c)return;a.textContent='字母'+(state.sortKey==='alpha'?(state.sortDir==='asc'?'↑':'↓'):'↕');c.textContent='市值'+(state.sortKey==='marketCap'?(state.sortDir==='asc'?'↑':'↓'):'↕');a.classList.toggle('active',state.sortKey==='alpha');c.classList.toggle('active',state.sortKey==='marketCap')}
function renderList(){renderSortButtons();const stocks=currentDateData().stocks;$('poolCount').textContent=state.filtered.length+' / '+state.symbols.length;$('stockList').innerHTML=state.filtered.map((t,idx)=>{const s=stocks[t];const field=metricFieldByPool[state.pool]||'gain3';const metric=s[field];return `<div class="row ${idx===state.selected?'active':''}" data-idx="${idx}"><div><div class="code">${s.ticker}</div><div class="industry">${s.exchange}</div></div><div><div class="name">${esc(s.name)}</div><div class="industry">${s.symbol} · 市值${capText(s)}</div></div><div class="metric">${fmt(metric)}${pctPools.has(state.pool)?'%':''}</div></div>`}).join('');[...document.querySelectorAll('.row')].forEach(el=>el.addEventListener('click',()=>{state.selected=Number(el.dataset.idx);renderList();renderSelected()}))}
function renderSelected(){state.chartIndex=null;const s=currentStock();$('positionText').textContent=state.filtered.length?`${state.selected+1} / ${state.filtered.length}`:'0 / 0';if(!s){$('stockTitle').textContent='-';$('stockSubtitle').textContent='当前筛选无结果';$('detailPanel').innerHTML='<div class="empty">当前股票池没有可展示标的。</div>';drawChart();return}$('stockTitle').textContent=`${s.ticker} ${s.name}`;$('stockSubtitle').textContent=`${s.exchange} · 收盘 ${fmt(s.price)} · 市值${capText(s)} · 成交量 ${fmt(s.volume,0)}`;renderDetail(s);drawChart();const active=document.querySelector('.row.active');if(active)active.scrollIntoView({block:'nearest'})}
function capText(s){if(s.marketCap===null||s.marketCap===undefined)return'缺';const cap=Number(s.marketCap);return' '+(cap>0&&cap<1?fmt(cap,2):fmt(cap,0))+'亿美元'}function link(url,label){return `<a href="${esc(url)}" target="_blank" rel="noreferrer noopener">${esc(label)}</a>`}
function renderDetail(s){const flags=Object.entries(APP.poolConfig).filter(([,cfg])=>cfg.flag).map(([k,cfg])=>`<span class="chip ${s.flags&&s.flags[k]?'flag':'off'}">${cfg.label}</span>`).join('');$('detailPanel').innerHTML=`<div class="card"><h3>个股信息</h3><div class="kv"><span>代码</span><b>${s.ticker}</b><span>公司</span><b>${esc(s.name)}</b><span>交易所</span><b>${s.exchange}</b><span>现价</span><b>${fmt(s.price)}</b><span>市值</span><b>${capText(s)}</b><span>日内高低</span><b>${fmt(s.dayHigh)} / ${fmt(s.dayLow)}</b><span>MA5 / MA10</span><b>${fmt(s.ma5)} / ${fmt(s.ma10)}</b><span>3日 / 5日</span><b>${fmt(s.gain3)}% / ${fmt(s.gain5)}%</b><span>年内前高</span><b>${fmt(s.year_prev_high)} · ${fmt(s.year_high_breakout)}%</b><span>3年前高</span><b>${fmt(s.three_year_prev_high)} · ${fmt(s.three_year_high_breakout)}%</b><span>历史前高</span><b>${fmt(s.history_prev_high)} · ${fmt(s.all_time_high_breakout)}%</b></div><div class="source">来源：SEC company_tickers_exchange universe；Yahoo Finance chart 日线。生成时间：${esc(APP.generatedAt)}</div></div><div class="card"><h3>命中形态</h3><div class="chips">${flags}</div></div><div class="card"><h3>外部链接</h3><div class="chips"><span class="chip">${link(s.links.yahoo,'Yahoo')}</span><span class="chip">${link(s.links.sec,'SEC')}</span><span class="chip">${link(s.links.search,'News')}</span></div></div>`}
function move(step){if(!state.filtered.length)return;state.selected=Math.max(0,Math.min(state.filtered.length-1,state.selected+step));state.chartIndex=null;renderList();renderSelected()}function zoom(delta){state.windowSize=Math.max(18,Math.min(150,state.windowSize+delta));state.chartIndex=null;drawChart()}function moveCandle(step){if(!chartMeta||!chartMeta.rows.length)return;state.chartIndex=Math.max(0,Math.min(chartMeta.rows.length-1,(state.chartIndex??chartMeta.rows.length-1)+step));drawChart()}function selectCandleFromMouse(e){if(!chartMeta||!chartMeta.rows.length)return;const rect=$('kCanvas').getBoundingClientRect();const raw=(e.clientX-rect.left-chartMeta.pad.l)/chartMeta.step;state.chartIndex=Math.max(0,Math.min(chartMeta.rows.length-1,Math.round(raw)));drawChart()}
function drawChart(){const canvas=$('kCanvas'),wrap=canvas.parentElement,dpr=window.devicePixelRatio||1,rect=wrap.getBoundingClientRect();canvas.width=Math.max(300,Math.floor(rect.width*dpr));canvas.height=Math.max(260,Math.floor(rect.height*dpr));const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);const w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);const s=currentStock();const full=s?(APP.klines[s.ticker]||[]):[];const allRows=full.filter(r=>r&&r[0]<=state.date);const rows=allRows.slice(-state.windowSize);if(!s||!rows.length){chartMeta=null;ctx.fillStyle='#67716e';ctx.fillText('无K线数据',20,30);return}const pad={l:56,r:16,t:30,b:84},priceH=h-pad.t-pad.b,volH=54;const minP=Math.min(...rows.map(r=>Math.min(r[2],r[3],r[6]||r[3],r[7]||r[3]))),maxP=Math.max(...rows.map(r=>Math.max(r[1],r[2],r[6]||r[2],r[7]||r[2]))),span=Math.max(.01,maxP-minP);const y=p=>pad.t+(maxP-p)/span*priceH,step=(w-pad.l-pad.r)/Math.max(1,rows.length-1),x=i=>pad.l+i*step,bw=Math.max(2,Math.min(10,(w-pad.l-pad.r)/rows.length*.58));drawGrid(ctx,w,h,pad,minP,maxP,y);for(let i=0;i<rows.length;i++){const r=rows[i],xi=x(i),up=r[4]>=r[1];ctx.strokeStyle=up?'#c84435':'#11805a';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(xi,y(r[2]));ctx.lineTo(xi,y(r[3]));ctx.stroke();const top=y(Math.max(r[1],r[4])),bottom=y(Math.min(r[1],r[4]));ctx.fillRect(xi-bw/2,top,bw,Math.max(1,bottom-top))}drawLine(ctx,rows,6,x,y,'#2e6f9e');drawLine(ctx,rows,7,x,y,'#a8701b');drawVolume(ctx,rows,x,w,h,pad,volH);const sel=Math.max(0,Math.min(rows.length-1,state.chartIndex??rows.length-1));state.chartIndex=sel;chartMeta={rows,pad,step};const selected=rows[sel],allIndex=allRows.length-rows.length+sel,prev=allRows[allIndex-1],pct=prev&&prev[4]?((selected[4]-prev[4])/prev[4]*100):null,xi=x(sel),up=pct===null?selected[4]>=selected[1]:pct>=0;ctx.save();ctx.strokeStyle='rgba(24,33,31,.55)';ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(xi,pad.t);ctx.lineTo(xi,h-pad.b+volH);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=up?'#c84435':'#11805a';ctx.beginPath();ctx.arc(xi,y(selected[4]),4,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,253,250,.92)';ctx.strokeStyle='#c9c5b9';ctx.lineWidth=1;const label=`${selected[0]} ${pct===null?'-':(pct>=0?'+':'')+fmt(pct)}%`;const tw=ctx.measureText(label).width+12,tx=Math.min(Math.max(8,xi-tw/2),w-tw-8);ctx.fillRect(tx,8,tw,20);ctx.strokeRect(tx,8,tw,20);ctx.fillStyle='#18211f';ctx.fillText(label,tx+6,22);ctx.restore();$('chartStatus').textContent=`${rows[0][0]} → ${rows[rows.length-1][0]} · ${rows.length} 根K线 · 选中 ${sel+1}/${rows.length}`;$('priceStatus').textContent=`${selected[0]} 涨跌幅 ${pct===null?'-':(pct>=0?'+':'')+fmt(pct)}% · O ${fmt(selected[1])} H ${fmt(selected[2])} L ${fmt(selected[3])} C ${fmt(selected[4])} V ${fmt(selected[5],0)}`}
function drawGrid(ctx,w,h,pad,minP,maxP,y){ctx.strokeStyle='#e5e1d7';ctx.fillStyle='#67716e';ctx.font='12px Consolas,monospace';for(let i=0;i<=4;i++){const p=minP+(maxP-minP)*i/4,yy=y(p);ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.fillText(fmt(p),8,yy+4)}}function drawLine(ctx,rows,idx,x,y,color){ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.beginPath();let started=false;rows.forEach((r,i)=>{if(r[idx]===null||r[idx]===undefined)return;if(!started){ctx.moveTo(x(i),y(r[idx]));started=true}else ctx.lineTo(x(i),y(r[idx]))});ctx.stroke()}function drawVolume(ctx,rows,x,w,h,pad,volH){const maxV=Math.max(...rows.map(r=>r[5]||0),1),base=h-28,bw=Math.max(2,Math.min(10,(w-pad.l-pad.r)/rows.length*.58));rows.forEach((r,i)=>{const up=r[4]>=r[1],vh=(r[5]||0)/maxV*volH;ctx.fillStyle=up?'rgba(200,68,53,.35)':'rgba(17,128,90,.35)';ctx.fillRect(x(i)-bw/2,base-vh,bw,vh)});ctx.fillStyle='#67716e';ctx.fillText('VOL',12,base-volH+8)}function esc(text){return String(text??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}init().catch(err=>{console.error(err);$('dataStatus').textContent='数据加载失败，请强制刷新';$('stockSubtitle').textContent=String(err.message||err)});
</script>
</body>
</html>
